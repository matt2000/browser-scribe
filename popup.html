<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    #toggleBtn {
      background-color: #4CAF50;
      color: white;
    }
    #toggleBtn.recording {
      background-color: #f44336;
    }
    #exportBtn, #resetBtn {
      background-color: #2196F3;
      color: white;
    }
    #status {
      margin: 10px 0;
      padding: 5px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="status">Not Recording</div>
  <button id="toggleBtn">Start Recording</button>
  <button id="exportBtn">Export JSON</button>
  <button id="resetBtn">Reset Log</button>
  <script src="popup.js"></script>
</body>
</html>
